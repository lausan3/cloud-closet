name: Build and Push Docker Image

on:
  workflow_call: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Create .env file from secret
      run: printf "%s\n" "${{ secrets.BACKEND_ENV }}" > .env

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}  # Use the Docker Hub PAT stored as a secret

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: ./backend  # Point to the 'server' directory where your Dockerfile is located
        push: true
        tags: ${{ secrets.DOCKERHUB_TAGS }}