name: Build and Push Docker Image

on:
  workflow_call:
    secrets:
      BACKEND_ENV:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DOCKERHUB_TAGS:
        required: true
  workflow_call:
    secrets:
      BACKEND_ENV:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DOCKERHUB_TAGS:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        show-progress: true
        sparse-checkout: |
          backend

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        show-progress: true
        sparse-checkout: |
          backend

    - name: Build and push
      run: |
        docker buildx build \
          --file ./backend/Dockerfile \
          --platform linux/arm64 \
          --tag ${{ secrets.DOCKERHUB_TAGS }} \
          --push ./backend