name: Deploy

on:
  workflow_call:
    inputs:
      CONTAINER_NAME:
        type: string
        required: true
    secrets:
      BACKEND_ENV:
        required: true
      DOCKERHUB_TAGS:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      EC2_HOST:
        required: true
      EC2_USER:
        required: true
      EC2_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Write secrets to instance
        run: echo "${{ secrets.BACKEND_ENV }}" >> .env

      - name: Login to docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} 
          
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            sudo docker system prune -f
            sudo docker pull ${{ secrets.DOCKERHUB_TAGS }}
            sudo docker stop ${{ vars.CONTAINER_NAME }}
            sudo docker rm -f ${{ vars.CONTAINER_NAME }}
            sudo docker run -d -v ./.env:/app/.env --env-file ./.env --rm --name ${{ vars.CONTAINER_NAME }} ${{ secrets.DOCKERHUB_TAGS }}

      - name: Delete secrets from instance
        run: rm .env